<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devcon Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

</head>

<body class="fixed-width">
    <header class="header-height display-flex">
        <!-- navigation bar -->
        <nav class="nav-flex-container flex-grow">
            <!-- logo -->
            <div>
                <img class="nav-logo" src="./assets/logo.png" alt="Site logo">

            </div>

            <!-- menus -->
            <div class="nav-menubar">
                <a class="nav-link" href="#">Speakers</a>
                <a class="nav-link" href="#">Schedule</a>
                <a class="nav-link" href="#">Tracks</a>
                <a class="nav-link" href="#">Venue</a>
                <a class="nav-link" href="#">Blog</a>
            </div>

            <!-- button on the right -->
            <div>
                <button class="nav-button">Register Now</button>
            </div>
        </nav>
    </header>

    <main>
        <!-- hero/banner section -->
        <section class="banner">
            <!-- <img src="./assets/banner.jpg" alt="hero"> -->

            <div class="banner-content">
                <!-- text display -->
                <div>
                    <h1>CODE. <em>Connect.</em> Create</h1>
                    <p>Join 4,000+ engineers, founders, and builders at the premier developer conference of 2026. Three
                        days
                        of
                        cutting-edge talks, hands-on workshops, and meaningful connections.</p>
                </div>
                <!-- Register button -->
                <div>
                    <button> Register Now</button>
                </div>
            </div>
        </section>
    </main>

    <footer>

    </footer>

</body>
